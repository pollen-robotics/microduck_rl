<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101419">
    <title>MicroDuck / policy evolution</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to dashboard</a>
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div>
          <p class="eyebrow">MicroDuck / stair policies</p>
          <h1>Policy evolution</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="connection-status" class="connection-status" aria-live="polite">Loading</span>
      </div>
    </header>

    <main id="main-content" class="page-shell video-only-shell">
      <div id="error-banner" class="notice notice-error" hidden role="alert"></div>
      <section class="panel media-panel" aria-labelledby="media-title">
        <div class="section-heading media-heading">
          <div>
            <p class="eyebrow">Newest sample first</p>
            <h2 id="media-title">Roll sprint evolution</h2>
            <p id="gallery-copy" class="gallery-copy">A rollout from the selected policy run.</p>
          </div>
          <div class="media-controls">
            <label class="video-selector">
              <span>Video run</span>
              <select id="video-collection" class="select-control" aria-label="Choose the training run to visualize"></select>
            </label>
            <span id="video-count" class="section-count">0 videos</span>
          </div>
        </div>
        <div id="media-grid" class="media-grid" aria-live="polite"></div>
        <div id="media-empty" class="empty-state" hidden>No training samples have been recorded yet.</div>
      </section>
    </main>

    <footer class="footer"><span>MicroDuck RL</span><span id="loaded-at">Waiting for samples</span></footer>
    <script src="/app.js" defer></script>
  </body>
</html>
