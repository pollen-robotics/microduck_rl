[project]
name = "microduck-footstepnet"
version = "0.1.0"
description = "FootstepNet planner (rhoban/footstepnet_envs) retrained with microduck's footstep contract"
requires-python = "==3.12.*"
dependencies = [
    "footstepsnet_envs @ git+https://github.com/rhoban/footstepnet_envs",
    # unpinned upstream; jax >= 0.7 removed APIs tensorflow_probability (sbx dep) still uses
    "jax[cuda12]==0.6.2",
    "flax<0.11",
]

[tool.uv]
package = false
