openapi: 3.1.0
info:
  title: MicroDuck ROM Simulator API
  version: 1.0.0
  description: Versioned typed-intent API for the MicroDuck MuJoCo simulator.
paths:
  /v1/health:
    get:
      operationId: health
      summary: Process liveness
      responses:
        '200':
          description: Simulator process is alive.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /v1/ready:
    get:
      operationId: ready
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Readiness status, content: {application/json: {schema: {$ref: '#/components/schemas/ReadyResponse'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
  /v1/catalog:
    get:
      operationId: catalog
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Installed manifest actions and availability, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogResponse'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
  /v1/robot/status:
    get:
      operationId: robotStatus
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Bounded BIPED_POSE_V1 snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/RobotStatus'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
  /v1/tasks:
    post:
      operationId: createTask
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/TaskCreateRequest'}}
      responses:
        '202': {description: Created or idempotently returned task, content: {application/json: {schema: {$ref: '#/components/schemas/TaskSnapshot'}}}}
        '400': {$ref: '#/components/responses/ParameterInvalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '409': {$ref: '#/components/responses/TaskConflict'}
  /v1/tasks/{taskId}:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      operationId: getTask
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Durable task snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/TaskSnapshot'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '404': {$ref: '#/components/responses/TaskNotFound'}
  /v1/tasks/{taskId}/cancel:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    post:
      operationId: cancelTask
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Idempotent safe-stop result, content: {application/json: {schema: {$ref: '#/components/schemas/TaskSnapshot'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '404': {$ref: '#/components/responses/TaskNotFound'}
  /v1/tasks/{taskId}/command:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    put:
      operationId: commandTask
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/TaskCommandRequest'}}
      responses:
        '200': {description: Idempotently accepted command, content: {application/json: {schema: {$ref: '#/components/schemas/TaskSnapshot'}}}}
        '400': {$ref: '#/components/responses/ParameterInvalid'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '404': {$ref: '#/components/responses/TaskNotFound'}
        '409': {$ref: '#/components/responses/CommandConflict'}
  /v1/tasks/{taskId}/events:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get:
      operationId: taskEvents
      security: [{bearerAuth: []}]
      parameters:
        - name: afterSequence
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200': {description: Ordered event page, content: {application/json: {schema: {$ref: '#/components/schemas/TaskEventPage'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '404': {$ref: '#/components/responses/TaskNotFound'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: opaque-token}
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
  responses:
    AuthRequired:
      description: Bearer token is absent or invalid.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, example: {code: AUTH_REQUIRED, message: Authentication is required, details: {}}}}
    ParameterInvalid:
      description: Typed intent is invalid.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, example: {code: PARAMETER_INVALID, message: Parameters are invalid, details: {}}}}
    TaskConflict:
      description: Task ID is reused with different content or the robot is busy.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, examples: {taskIdConflict: {value: {code: TASK_ID_CONFLICT, message: Task ID conflicts with an existing request, details: {}}}, robotBusy: {value: {code: ROBOT_BUSY, message: Robot already has an active task, details: {}}}}}}
    StaleCommand:
      description: Command sequence is stale.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, example: {code: STALE_COMMAND, message: Command sequence is stale, details: {}}}}
    CommandConflict:
      description: Command sequence is stale or reused with different command content.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, examples: {staleCommand: {value: {code: STALE_COMMAND, message: Command sequence is stale, details: {}}}, sequenceConflict: {value: {code: COMMAND_SEQUENCE_CONFLICT, message: Command sequence conflicts with already accepted content, details: {}}}}}}
    TaskNotFound:
      description: Task does not exist.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, example: {code: TASK_NOT_FOUND, message: Task was not found, details: {}}}}
  schemas:
    Digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties: {code: {type: string, enum: [AUTH_REQUIRED, NOT_READY, BUNDLE_MISMATCH, ACTION_UNAVAILABLE, PARAMETER_INVALID, PRECONDITION_FAILED, ROBOT_BUSY, TASK_ID_CONFLICT, COMMAND_SEQUENCE_CONFLICT, STALE_COMMAND, TASK_NOT_FOUND, INTERNAL_ERROR]}, message: {type: string}, details: {type: object}}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [alive]
      properties: {alive: {const: true}}
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [ready, reasonCodes]
      properties: {ready: {type: boolean}, robotModel: {type: [string, 'null']}, bundleId: {type: [string, 'null']}, bundleVersion: {type: [string, 'null']}, bundleDigest: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}, reasonCodes: {type: array, items: {type: string}}}
    CatalogResponse:
      type: object
      additionalProperties: false
      required: [observationContract, actionContract, actions]
      properties: {bundleId: {type: [string, 'null']}, bundleVersion: {type: [string, 'null']}, bundleDigest: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}, observationContract: {const: MICRODUCK_OBS_61_V1}, actionContract: {const: MICRODUCK_ACTION_14_V1}, actions: {type: array, items: {$ref: '#/components/schemas/ActionDefinition'}}}
    CompletionContract:
      type: object
      additionalProperties: false
      required: [terminalConditions, maxDurationMs]
      properties: {terminalConditions: {type: array, minItems: 1, items: {type: string}}, maxDurationMs: {type: integer, exclusiveMinimum: 0}}
    LeaseContract:
      type: object
      additionalProperties: false
      x-unergy-invariants: [minLeaseMs <= defaultLeaseMs <= maxLeaseMs, commandCadenceMs <= minLeaseMs]
      required: [minLeaseMs, defaultLeaseMs, maxLeaseMs, commandCadenceMs, zeroCommand, safeStopBehavior]
      properties: {minLeaseMs: {type: integer, exclusiveMinimum: 0}, defaultLeaseMs: {type: integer, exclusiveMinimum: 0}, maxLeaseMs: {type: integer, exclusiveMinimum: 0}, commandCadenceMs: {type: integer, exclusiveMinimum: 0}, zeroCommand: {type: object, additionalProperties: {type: number}}, safeStopBehavior: {const: ZERO_TWIST}}
    ActionDefinition:
      type: object
      additionalProperties: false
      required: [actionCode, executionMode, availability, parameterSchema]
      properties: {actionCode: {type: string}, executionMode: {enum: [DISCRETE, CONTINUOUS_LEASE]}, availability: {enum: [AVAILABLE, UNAVAILABLE]}, policyRef: {type: [string, 'null']}, unavailableReason: {type: [string, 'null']}, parameterSchema: {type: object}, completion: {anyOf: [{$ref: '#/components/schemas/CompletionContract'}, {type: 'null'}]}, lease: {anyOf: [{$ref: '#/components/schemas/LeaseContract'}, {type: 'null'}]}, displayName: {type: [string, 'null']}, description: {type: [string, 'null']}, localizedLabels: {type: [object, 'null'], additionalProperties: {type: string}}, preconditions: {type: [object, 'null']}, safety: {type: [object, 'null']}, qualificationRefs: {type: [array, 'null'], items: {type: string}}}
      allOf:
        - if: {properties: {availability: {const: AVAILABLE}}, required: [availability]}
          then: {required: [policyRef], properties: {policyRef: {type: string, minLength: 1}}}
        - if: {properties: {executionMode: {const: CONTINUOUS_LEASE}}, required: [executionMode]}
          then: {required: [lease], properties: {lease: {$ref: '#/components/schemas/LeaseContract'}}}
    SafeJsonValue:
      anyOf: [{type: string}, {type: number}, {type: boolean}, {type: 'null'}, {$ref: '#/components/schemas/SafeJsonObject'}, {$ref: '#/components/schemas/SafeJsonArray'}]
    SafeJsonArray: {type: array, items: {$ref: '#/components/schemas/SafeJsonValue'}}
    SafeJsonObject:
      type: object
      propertyNames: {not: {pattern: '(?i:joint|torque|pwm|policypath|policyname)'}}
      additionalProperties: {$ref: '#/components/schemas/SafeJsonValue'}
    TaskCreateRequest:
      type: object
      additionalProperties: false
      required: [schema, taskId, actionCode, bundleVersion, bundleDigest, parameters, scenario, requestedBy]
      properties: {schema: {const: MICRODUCK_SIM_TASK_V1}, taskId: {type: string, pattern: '^[0-9a-f]{32}$'}, actionCode: {type: string}, bundleVersion: {type: string}, bundleDigest: {$ref: '#/components/schemas/Digest'}, parameters: {$ref: '#/components/schemas/SafeJsonObject'}, scenario: {type: object}, leaseMs: {type: [integer, 'null'], exclusiveMinimum: 0}, requestedBy: {type: string}}
    TaskCommandRequest:
      type: object
      additionalProperties: false
      required: [commandSequence, parameters, leaseMs]
      properties: {commandSequence: {type: integer, minimum: 0}, parameters: {$ref: '#/components/schemas/SafeJsonObject'}, leaseMs: {type: integer, exclusiveMinimum: 0}}
    TaskEvidence:
      type: object
      additionalProperties: false
      required: [bundleDigest, policyDigest, metrics]
      properties: {bundleDigest: {$ref: '#/components/schemas/Digest'}, policyDigest: {$ref: '#/components/schemas/Digest'}, modelDigest: {anyOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]}, metrics: {type: object}, stopReason: {type: [string, 'null']}}
    TaskSnapshot:
      type: object
      additionalProperties: false
      required: [taskId, state, actionCode, bundleVersion, bundleDigest, requestedAt, updatedAt]
      properties: {taskId: {type: string, pattern: '^[0-9a-f]{32}$'}, state: {enum: [ACCEPTED, VALIDATING, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, UNKNOWN]}, actionCode: {type: string}, bundleVersion: {type: string}, bundleDigest: {$ref: '#/components/schemas/Digest'}, requestedAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}, evidence: {anyOf: [{$ref: '#/components/schemas/TaskEvidence'}, {type: 'null'}]}, stopReason: {type: [string, 'null']}}
    TaskEvent:
      type: object
      additionalProperties: false
      required: [sequence, eventType, payload, createdAt]
      properties: {sequence: {type: integer, minimum: 0}, eventType: {type: string}, payload: {type: object}, createdAt: {type: string, format: date-time}}
    TaskEventPage:
      type: object
      additionalProperties: false
      required: [events]
      properties: {events: {type: array, items: {$ref: '#/components/schemas/TaskEvent'}}}
    RobotStatus:
      type: object
      additionalProperties: false
      required: [schema, timestamp, basePositionM, baseOrientationXyzw, baseLinearVelocityMps, baseAngularVelocityRadps, jointPositionsRad, jointVelocitiesRadps, policyTarget, requestedMotion, appliedMotion, simulationTimeS, loopFrequencyHz, fallen, limp, health]
      properties: {schema: {const: BIPED_POSE_V1}, timestamp: {type: string, format: date-time}, basePositionM: {$ref: '#/components/schemas/Vec3'}, baseOrientationXyzw: {$ref: '#/components/schemas/Vec4'}, baseLinearVelocityMps: {$ref: '#/components/schemas/Vec3', description: World-frame trunk-base linear velocity.}, baseAngularVelocityRadps: {$ref: '#/components/schemas/Vec3', description: 'Trunk-body-frame angular velocity, matching the training IMU gyro.'}, jointPositionsRad: {$ref: '#/components/schemas/Vec14'}, jointVelocitiesRadps: {$ref: '#/components/schemas/Vec14'}, policyTarget: {type: object}, requestedMotion: {type: object}, appliedMotion: {type: object}, limitingReason: {type: [string, 'null']}, activePolicyRef: {type: [string, 'null']}, activeActionCode: {type: [string, 'null']}, activeTaskId: {type: [string, 'null'], pattern: '^[0-9a-f]{32}$'}, simulationTimeS: {type: number, minimum: 0}, loopFrequencyHz: {type: number, minimum: 0}, fallen: {type: boolean}, limp: {type: boolean}, health: {type: object}}
    Vec3: {type: array, minItems: 3, maxItems: 3, items: {type: number}}
    Vec4: {type: array, minItems: 4, maxItems: 4, items: {type: number}}
    Vec14: {type: array, minItems: 14, maxItems: 14, items: {type: number}}
